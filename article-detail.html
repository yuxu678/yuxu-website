  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    if (typeof lucide !== 'undefined') {
      try { lucide.createIcons(); } catch(e) {}
    }

    // 移动端菜单
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    if (mobileMenuBtn) {
      mobileMenuBtn.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
      });
    }

    if (mobileMenu) {
      mobileMenu.addEventListener('click', (e) => {
        if (e.target.tagName === 'A') {
          mobileMenu.classList.add('hidden');
        }
      });
    }
  </script>
  <script>
    function cleanArticleContent(content) {
      if (!content) return '';
      return content
        .replace(/\\"/g, '"')
        .replace(/\\n/g, '\n');
    }

    function loadArticle() {
      var urlParams = new URLSearchParams(window.location.search);
      var articleId = urlParams.get('id');

      if (!articleId) {
        console.warn('[Article] No article ID in URL');
        return;
      }

      if (typeof articlesContent === 'undefined') {
        console.error('[Article] articlesContent not loaded');
        document.getElementById('article-content-body').textContent = '文章内容加载失败，请稍后再试';
        return;
      }

      var article = articlesContent.find(function(a) { return a.id === articleId; });
      if (!article) {
        console.error('[Article] Article not found:', articleId);
        document.getElementById('article-content-body').textContent = '未找到该文章（ID: ' + articleId + '）';
        return;
      }

      document.title = article.title + ' - 喻旭 · 青峰侠';

      var titleEl = document.getElementById('article-title');
      if (titleEl) titleEl.textContent = article.title;

      var dateTextEl = document.getElementById('article-date-text');
      if (dateTextEl) dateTextEl.textContent = article.date;

      var contentBody = document.getElementById('article-content-body');
      if (contentBody) {
        var cleanedContent = cleanArticleContent(article.content);
        contentBody.innerHTML = cleanedContent;
        console.log('[Article] Content loaded, length:', cleanedContent.length);
      }

      if (typeof getArticleTag === 'function') {
        var tagInfo = getArticleTag(article.title);
        if (tagInfo) {
          var tagsContainer = document.getElementById('article-tags');
          if (tagsContainer) {
            var tagSpan = document.createElement('span');
            tagSpan.className = 'px-3 py-1 rounded-full text-xs font-medium bg-' + tagInfo.color + '/10 text-' + tagInfo.color;
            tagSpan.textContent = tagInfo.name;
            tagsContainer.appendChild(tagSpan);
          }

          var breadcrumbTag = document.getElementById('article-breadcrumb-tag');
          if (breadcrumbTag) breadcrumbTag.textContent = tagInfo.name;
        }
      }

      if (typeof lucide !== 'undefined') {
        try { lucide.createIcons(); } catch(e) {}
      }
    }

    loadArticle();

    function copyArticleUrl() {
      var input = document.createElement('input');
      input.value = window.location.href;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);
      alert('链接已复制到剪贴板');
    }
  </script>
