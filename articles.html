  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    lucide.createIcons();

    // 移动端菜单
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    
    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    mobileMenu.addEventListener('click', (e) => {
      if (e.target.tagName === 'A') {
        mobileMenu.classList.add('hidden');
      }
    });

    // 动态渲染文章列表
    function renderPage(page) {
      var totalPages = Math.ceil(latestArticles.length / 6);
      renderArticleCards(latestArticles, 'article-grid', page, 6);
      updatePagination(totalPages, page, 'article-prev', 'article-next', 'article-page-');
    }

    // 分页按钮事件绑定
    document.getElementById('article-prev').addEventListener('click', function() {
      var activePage = parseInt(document.getElementById('article-grid').getAttribute('data-current') || '1');
      if (activePage > 1) renderPage(activePage - 1);
    });

    document.getElementById('article-next').addEventListener('click', function() {
      var activePage = parseInt(document.getElementById('article-grid').getAttribute('data-current') || '1');
      var totalPages = Math.ceil(latestArticles.length / 6);
      if (activePage < totalPages) renderPage(activePage + 1);
    });

    for (var i = 1; i <= 5; i++) {
      (function(pageNum) {
        document.getElementById('article-page-' + pageNum).addEventListener('click', function() {
          renderPage(pageNum);
        });
      })(i);
    }

    // 初始化加载第一页
    renderPage(1);
  </script>
